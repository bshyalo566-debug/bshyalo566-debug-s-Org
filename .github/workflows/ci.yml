name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permissions for scripts
        run: |
          chmod +x gradlew
          if [ -f bootstrap-gradle.sh ]; then chmod +x bootstrap-gradle.sh; fi

      - name: Build Debug APK (Skip Lint)
        run: ./gradlew assembleStandardDebug -x lint --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: engineer-omar-ai-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
